# Checks for new agendas, calendar changes and same-week previews every 2 hours, 6 a.m. to 10 p.m. Indiana time.
# Runs on GitHub's free scheduler and calls the site's /api/tick (which skips itself if it ran recently).
name: Check for new meeting documents
on:
  schedule:
    - cron: "7 10-23/2,0,2 * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run the check
        run: curl -fsS --max-time 290 https://localmeetings.vercel.app/api/tick
